name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache sherpa-onnx AAR
        id: aarcache
        uses: actions/cache@v4
        with:
          path: app/libs
          key: sherpa-aar-2.0.1

      - name: Fetch sherpa-onnx AAR
        if: steps.aarcache.outputs.cache-hit != 'true'
        run: ./scripts/fetch-sherpa-aar.sh 2.0.1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: remotemic-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
